<!doctype html>
<!--
    Imagem dos links compartilhados do portfólio (1200x630), em en e pt: `?l=en` ou `?l=pt`.
    Repete a abertura do site no tema escuro: o brilho atrás da figura, a frase leve no topo,
    o selo de disponível, o nome em cartaz e o cargo. Os textos são os de `hero` em
    `content/dictionary.ts`; se mudarem lá, mudam aqui.
    Quem fotografa é `scripts/og-perfil.mjs`.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Hanken+Grotesk:wght@300;600;800&display=block"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0b0d;
            --text: #eceef2;
            --muted: #9aa1ad;
            --border: #22262d;
            --accent: #5fa8ff;
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            position: relative;
            font-family: "Hanken Grotesk", sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* O mesmo brilho da abertura (.stage), puxado para o lado da figura. */
        .stage {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 44% 72% at 70% 60%, rgb(95 168 255 / 0.2), transparent 70%);
        }

        /* A figura recortada, com o filtro do tema escuro (--figure-filter). */
        .figure {
            position: absolute;
            top: 34px;
            right: 64px;
            height: 900px;
            filter: brightness(1.16) saturate(0.9) contrast(1.02);
        }

        /* Dissolve a figura no rodapé, como o .figure-scrim do site. */
        .scrim {
            position: absolute;
            inset: auto 0 0 0;
            height: 200px;
            background: linear-gradient(to top, var(--bg) 8%, transparent);
        }

        .copy {
            position: absolute;
            top: 64px;
            bottom: 60px;
            left: 72px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* .split-line: peso leve para contrastar com o cartaz. */
        .split {
            max-width: 14em;
            font-size: 36px;
            font-weight: 300;
            line-height: 1.1;
            letter-spacing: -0.035em;
            text-wrap: balance;
        }

        /* .label: mono, caixa alta e espaçado, na cor de destaque. */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px 10px 18px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgb(10 11 13 / 0.7);
            color: var(--accent);
            font-family: "Geist Mono", monospace;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* .poster: o nome é o único texto em caixa alta e peso 800. */
        .name {
            margin-top: 22px;
            font-size: 108px;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.045em;
            text-transform: uppercase;
        }

        /* .poster-sub: acompanha o nome sem disputar com ele. */
        .sub {
            margin-top: 18px;
            color: var(--muted);
            font-size: 22px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="stage"></div>
    <img class="figure" src="../public/portrait/hero.66a85884.webp" alt="" />
    <div class="scrim"></div>

    <main class="copy">
        <p class="split" data-t="headline"></p>
        <div>
            <span class="pill"><span class="dot"></span><span data-t="available"></span></span>
            <h1 class="name">Andre<br />Oleari</h1>
            <p class="sub"><span data-t="role"></span><br /><span data-t="location"></span></p>
        </div>
    </main>

    <script>
        const textos = {
            en: {
                headline: "I build mobile apps, but the interesting part is behind the screen.",
                available: "Open to work",
                role: "Mobile Software Engineer",
                location: "Cork, Ireland",
            },
            pt: {
                headline: "Construo apps mobile, mas o mais interessante acontece fora da tela.",
                available: "Aberto a propostas",
                role: "Engenheiro de Software Mobile",
                location: "Cork, Irlanda",
            },
        };
        const idioma = new URLSearchParams(location.search).get("l") === "pt" ? "pt" : "en";
        document.documentElement.lang = idioma === "pt" ? "pt-BR" : "en";
        for (const el of document.querySelectorAll("[data-t]")) el.textContent = textos[idioma][el.dataset.t];
    </script>
</body>
</html>
