<!doctype html>
<!--
  Imagem dos links compartilhados do Lista Virtual (og:image e cartão do X),
  1200x630. Quem gera o JPEG é `scripts/og-lista-virtual.mjs`; este arquivo é
  só o desenho, com os tokens de `.brand-lista`. Os textos repetem os de
  `content/lista-virtual.ts` (título, subtítulo e nota): mudou lá, muda aqui e
  roda o script de novo.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Wittgenstein:ital,wght@0,500;0,600;1,500&display=block" rel="stylesheet">
<style>
:root { --bg:#14110c; --text:#ede4d0; --muted:#c7bca2; --gold-light:#e6c46a;
  --brass-text: linear-gradient(100deg, #c9a227 0%, #ead08a 48%, #e0bd5a 70%, #b98b1f 100%);
  --serif: "Wittgenstein", Georgia, serif; --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1200px; height:630px; overflow:hidden; }
body { position:relative; color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  background: radial-gradient(600px 480px at 900px 315px, rgb(212 168 58 / 0.12), transparent 70%), var(--bg); }
.copy { position:absolute; left:76px; top:0; bottom:0; width:600px; display:flex; flex-direction:column; justify-content:center; }
.brand { display:flex; align-items:center; gap:14px; font-family:var(--serif); font-weight:600; font-size:28px; letter-spacing:-0.012em; }
.brand img { width:46px; height:46px; }
h1 { margin-top:38px; font-family:var(--serif); font-weight:600; font-size:78px; line-height:0.98; letter-spacing:-0.028em; text-wrap:balance; }
.accent { position:relative; display:inline-block; }
.accent em { font-style:italic; font-weight:500; background:var(--brass-text); -webkit-background-clip:text; background-clip:text; color:transparent; padding-right:0.08em; }
.swash { position:absolute; left:-2%; bottom:-0.16em; width:104%; height:0.24em; overflow:visible; fill:none; stroke:url(#swash-gold); stroke-width:5; stroke-linecap:round; }
.swash .thin { stroke-width:2.5; opacity:.55; }
.sub { margin-top:36px; font-size:25px; line-height:1.45; color:var(--muted); max-width:26em; text-wrap:balance; }
.rating { margin-top:34px; display:flex; align-items:center; gap:14px; }
.rating strong { font-family:var(--serif); font-weight:600; font-size:32px; }
.rating svg { width:124px; height:auto; overflow:visible; filter:drop-shadow(0 0 6px rgb(230 196 106 / .25)); }
.stars-off { fill:rgb(201 162 39 / .22); stroke:rgb(201 162 39 / .22); }
.rating use { stroke-width:1.2; }
.label { margin-top:10px; font-size:15px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-light); }
.stage { position:absolute; left:640px; top:0; width:520px; height:630px; }
.symbol { position:absolute; left:50%; top:50%; width:560px; translate:-50% -50%; opacity:.6; filter:drop-shadow(0 0 22px rgb(230 196 106 / .16)); }
.phone { position:absolute; left:50%; top:50%; width:250px; translate:-50% -50%; rotate:-4deg; filter:drop-shadow(0 30px 40px rgb(8 5 2 / .7)); }
.frame { position:relative; aspect-ratio:1008/2060; width:100%; }
.screen { position:absolute; left:5.357%; top:2.573%; width:89.187%; height:94.854%; overflow:hidden; border-radius:12%/5.6%; }
.screen img { width:100%; height:100%; object-fit:cover; object-position:top; }
.molde { position:absolute; inset:0; width:100%; height:100%; }
.nw { white-space:nowrap; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="swash-gold" x1="0" x2="1"><stop offset="0" stop-color="#a9781a"/><stop offset=".5" stop-color="#ead08a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
  <linearGradient id="brass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eed48c"/><stop offset=".55" stop-color="#e0bd5a"/><stop offset="1" stop-color="#b3861f"/></linearGradient>
  <clipPath id="fill"><rect x="0" y="0" width="122.4" height="24"/></clipPath>
  <g id="row">
    <path d="M12 2.6 14.85 8.4l6.35.93-4.6 4.48 1.09 6.33L12 17.15l-5.69 2.99 1.09-6.33-4.6-4.48 6.35-.93z" stroke-linejoin="round"/>
    <path transform="translate(28 0)" d="M12 2.6 14.85 8.4l6.35.93-4.6 4.48 1.09 6.33L12 17.15l-5.69 2.99 1.09-6.33-4.6-4.48 6.35-.93z" stroke-linejoin="round"/>
    <path transform="translate(56 0)" d="M12 2.6 14.85 8.4l6.35.93-4.6 4.48 1.09 6.33L12 17.15l-5.69 2.99 1.09-6.33-4.6-4.48 6.35-.93z" stroke-linejoin="round"/>
    <path transform="translate(84 0)" d="M12 2.6 14.85 8.4l6.35.93-4.6 4.48 1.09 6.33L12 17.15l-5.69 2.99 1.09-6.33-4.6-4.48 6.35-.93z" stroke-linejoin="round"/>
    <path transform="translate(112 0)" d="M12 2.6 14.85 8.4l6.35.93-4.6 4.48 1.09 6.33L12 17.15l-5.69 2.99 1.09-6.33-4.6-4.48 6.35-.93z" stroke-linejoin="round"/>
  </g>
</defs></svg>
<div class="copy">
  <div class="brand"><img src="../public/logos/lista-virtual-monograma.f8442acf.webp" alt="">Lista Virtual</div>
  <h1><span id="headline"></span> <span class="accent"><em id="accent"></em><svg class="swash" viewBox="0 0 300 22" preserveAspectRatio="none"><path d="M4 15C70 6 170 3 296 9"/><path class="thin" d="M40 19C110 13 190 12 262 15"/></svg></span></h1>
  <p class="sub" id="sub"></p>
  <div class="rating"><strong id="rating"></strong>
    <svg viewBox="0 0 136 24"><use href="#row" class="stars-off"/><use href="#row" fill="url(#brass)" stroke="url(#brass)" clip-path="url(#fill)"/></svg>
  </div>
  <p class="label" id="label"></p>
</div>
<div class="stage">
  <img class="symbol" src="../public/logos/lista-virtual-simbolo.1f90848d.webp" alt="">
  <div class="phone"><div class="frame">
    <div class="screen"><img id="tela" alt=""></div>
    <img class="molde" src="../public/molde.png" alt="">
  </div></div>
</div>
<script>
const T = {
  pt: { headline: "Lista de convidados", accent: "sem papel", sub: "Convite pelo WhatsApp e check-in por QR Code na portaria.", rating: "4,5", label: "203 avaliações nas lojas", tela: "../public/telas/lista-virtual-pt-qr.99a9a98a.webp" },
  en: { headline: "The guest list,", accent: "without paper", sub: "WhatsApp invitations and QR code check-in at the door.", rating: "4.5", label: "203 store ratings", tela: "../public/telas/lista-virtual-2.d0874f96.webp" },
};
const t = T[new URLSearchParams(location.search).get("l") || "pt"];
for (const k of ["headline", "accent", "rating", "label"]) document.getElementById(k).textContent = t[k];
document.getElementById("sub").innerHTML = t.sub.replace(/check-in|QR code/gi, (m) => `<span class="nw">${m}</span>`);
document.getElementById("tela").src = t.tela;
document.documentElement.lang = new URLSearchParams(location.search).get("l") || "pt";
</script>
</body></html>
